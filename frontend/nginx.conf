server {
    listen 80;
    server_name localhost;

    # Bloqueia qualquer tentativa de acessar arquivos ocultos (.git, .env, .htaccess, etc.)
    # Prevenção Item 1 & 16 do Checklist de Segurança
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Bloqueia arquivos de backup ou dumps (.bak, .sql, .log)
    location ~* \.(bak|sql|log|old|orig|swp)$ {
        deny all;
        return 404;
    }

    # Cabeçalhos de Segurança HTTP recomendados
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
