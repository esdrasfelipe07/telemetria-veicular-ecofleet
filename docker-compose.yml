services:
  # Banco de Dados Relacional PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ecofleet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: telemetry_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecofleet_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/telemetry_db
      JWT_SECRET_KEY: super-secret-key-ufrn-telemetry-2026
      SPEED_LIMIT_KMH: 80.0
      MAX_ENGINE_TEMP_C: 102.0
      MIN_BATTERY_VOLTS: 11.5
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend React (Vite + Tailwind + Leaflet)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecofleet_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
